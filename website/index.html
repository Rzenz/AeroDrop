<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AeroDrop flies orders from UCLM campus vendors to your building by drone. Order, track the flight live, and get it at your drop zone." />
    <meta name="theme-color" content="#ffffff" />
    <title>AeroDrop · Campus drone delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved or system theme before first paint, so there is no flash.
      try {
        var t = localStorage.getItem('aerodrop-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#000000' : '#ffffff';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
